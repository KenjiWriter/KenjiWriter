<text class="mono mu lbl fd a8" x="40" y="288">DATA &amp; SERVICES</text>
<g class="in a9">
  <rect x="40" y="300" width="205" height="56" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text class="sans fg" x="56" y="300" dy="24" font-size="14" font-weight="600">PostgreSQL</text>
