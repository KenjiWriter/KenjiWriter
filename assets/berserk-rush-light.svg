<svg xmlns="http://www.w3.org/2000/svg" width="884" height="410" viewBox="38 0 884 410" role="img" aria-labelledby="title desc">
<title id="title">Berserk Rush architecture</title>
<desc id="desc">Clients (browser, Android and iOS, Windows, Discord and public API) talk to a Laravel 12 application on Octane, backed by PostgreSQL, Reverb WebSockets, queue workers and integrations.</desc>
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace}
.fg{fill:#1f2328} .mu{fill:#59636e} .ac{fill:#c2410c}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes flow{from{stroke-dashoffset:16}to{stroke-dashoffset:0}}
@keyframes pulse{0%{transform:scale(.7);opacity:.5}100%{transform:scale(1.7);opacity:0}}
@media (prefers-reduced-motion: reduce){.pk{display:none}}.wire{fill:none;stroke:#d0d7de;stroke-width:1.2;stroke-dasharray:3 5}
.lbl{font-size:11px;letter-spacing:2px}
.chip rect{fill:none;stroke:#d0d7de}
@media (prefers-reduced-motion: no-preference){
  .in{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
  .fd{opacity:0;animation:fade 1s ease forwards}
  .wire{animation:flow 1.6s linear infinite}
}.a0{animation-delay:0.05s}.a1{animation-delay:0.12s}.a2{animation-delay:0.19s}.a3{animation-delay:0.26s}.a4{animation-delay:0.33s}.a5{animation-delay:0.40s}.a6{animation-delay:0.47s}.a7{animation-delay:0.54s}.a8{animation-delay:0.61s}.a9{animation-delay:0.68s}.a10{animation-delay:0.75s}.a11{animation-delay:0.82s}.a12{animation-delay:0.89s}.a13{animation-delay:0.96s}.a14{animation-delay:1.03s}.a15{animation-delay:1.10s}.c0{animation-delay:0.95s}.c1{animation-delay:0.99s}.c2{animation-delay:1.04s}.c3{animation-delay:1.08s}.c4{animation-delay:1.13s}.c5{animation-delay:1.17s}.c6{animation-delay:1.22s}.c7{animation-delay:1.26s}.c8{animation-delay:1.31s}.c9{animation-delay:1.35s}.c10{animation-delay:1.40s}.c11{animation-delay:1.44s}.c12{animation-delay:1.49s}
</style>
