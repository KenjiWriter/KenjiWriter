  <text class="mono mu" x="896" y="181" font-size="12" text-anchor="end">32 domain modules</text>
  <text class="sans mu" x="64" y="203" font-size="13">Server-authoritative game logic · Result pattern · every transfer in a DB transaction with idempotency guards</text>
</g>
