<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="36 0 900 260" role="img" aria-labelledby="title desc">
<title id="title">Maciej Wiśniewski</title>
<desc id="desc">Software architect for digital business. Computer science engineering student specializing in network and systems security.</desc>
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace}
.fg{fill:#e6edf3} .mu{fill:#8b949e} .ac{fill:#f0883e}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes flow{from{stroke-dashoffset:16}to{stroke-dashoffset:0}}
@keyframes pulse{0%{transform:scale(.7);opacity:.5}100%{transform:scale(1.7);opacity:0}}
@media (prefers-reduced-motion: reduce){.pk{display:none}}.edge{fill:none;stroke:#30363d;stroke-width:1.2}
.node{fill:#0d1117;stroke:#8b949e;stroke-width:1.4}
.ring{fill:none;stroke:#f0883e;stroke-width:1.2;opacity:.25;transform-box:fill-box;transform-origin:center}
.rule{fill:none;stroke:#f0883e;stroke-width:2;stroke-linecap:round}
@media (prefers-reduced-motion: no-preference){
  .in{opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
  .fd{opacity:0;animation:fade 1.2s ease forwards}
  .edge,.rule{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s cubic-bezier(.4,0,.2,1) forwards}
  .rule{animation-duration:.8s;animation-delay:.75s}
  .ring{animation:pulse 3.4s ease-out 1.6s infinite}
}.d0{animation-delay:0.05s}.d1{animation-delay:0.17s}.d2{animation-delay:0.29s}.d3{animation-delay:0.41s}.d4{animation-delay:0.53s}.e0{animation-delay:0.50s}.e1{animation-delay:0.58s}.e2{animation-delay:0.66s}.e3{animation-delay:0.74s}.e4{animation-delay:0.82s}.e5{animation-delay:0.90s}.e6{animation-delay:0.98s}.e7{animation-delay:1.06s}.e8{animation-delay:1.14s}.n0{animation-delay:0.90s}.n1{animation-delay:0.97s}.n2{animation-delay:1.04s}.n3{animation-delay:1.11s}.n4{animation-delay:1.18s}.n5{animation-delay:1.25s}.n6{animation-delay:1.32s}
</style>
